# Optional but recommended: makes the build/restart behavior explicit
# instead of relying only on Railway dashboard defaults.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# sshd runs forever in the foreground; if it ever exits (crash, OOM, etc.)
# Railway should bring the container back up on its own.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
numReplicas = 1
